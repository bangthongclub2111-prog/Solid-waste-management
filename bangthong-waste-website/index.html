<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บ้านนี้แยกขยะ อบต.บางทอง</title><style>
:root{--green:#185d48;--lime:#d8ed8c;--bg:#f6f7f2;--muted:#708078}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#243e33;font:16px/1.65 'Noto Sans Thai',Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b7d76b;outline-offset:3px}header{background:white;border-bottom:1px solid #e1e8df;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;gap:13px;align-items:center}.mark{background:var(--green);color:var(--lime);border-radius:16px;width:49px;height:49px;display:grid;place-items:center;font-size:30px}.brand strong{font-size:18px}.sub{color:var(--muted);font-size:13px}.switch{display:flex;padding:5px;background:#f0f4ec;border-radius:30px}.switch button{border:0;border-radius:25px;padding:8px 17px;background:none;color:var(--green)}.switch button.active{background:var(--green);color:white}.demo{padding:8px 5%;background:#fff6dc;font-size:13px;color:#80652b}main{max-width:1210px;margin:auto;padding:30px 30px 70px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:27px}nav button{border:0;background:none;color:#60766a;padding:9px 16px;border-radius:24px}nav button.active{background:#e3edd9;color:var(--green);font-weight:bold}.hero{background:var(--green);border-radius:26px;position:relative;overflow:hidden;display:grid;grid-template-columns:1.3fr 1fr;padding:44px 45px;color:white;gap:25px}.eyebrow{color:var(--lime);font-size:13px;letter-spacing:1px}.hero h1{font-size:43px;line-height:1.35;margin:17px 0}.hero p{color:#d4e2d8;max-width:490px}.btn{border:0;border-radius:10px;padding:11px 20px;background:var(--green);color:white;display:inline-block}.btn.light{background:var(--lime);color:#29462f;font-weight:bold}.btn.ghost{background:#fff;color:var(--green);border:1px solid #d9e2d6}.art{display:flex;align-items:center;justify-content:center;position:relative;min-height:265px}.circle{position:absolute;width:280px;height:280px;border-radius:50%;background:#2b7153}.house{position:relative;width:165px;height:153px;background:#f4f5df;border-radius:9px;margin-top:50px}.roof{position:absolute;top:-72px;left:-24px;border-left:106px solid transparent;border-right:106px solid transparent;border-bottom:82px solid #a5c668}.door{position:absolute;bottom:0;left:64px;background:#3c7c5c;width:40px;height:67px;border-radius:20px 20px 0 0}.window{position:absolute;top:30px;left:22px;width:32px;height:32px;border:5px solid #91b278;background:#d9e9e2}.bins{position:absolute;bottom:4px;display:flex;gap:10px;transform:rotate(-3deg)}.bin{height:64px;width:48px;border-radius:5px 5px 12px 12px;box-shadow:0 -7px 0 #ffffff66;display:grid;place-items:center;font-size:23px}.leaf{position:absolute;right:10px;top:20px;border-radius:80% 0 80% 0;background:var(--lime);width:52px;height:30px;transform:rotate(-25deg)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:26px 0}.card{border:1px solid #e1e7dc;background:white;border-radius:18px;padding:23px}.action{text-align:left;width:100%;color:inherit;transition:transform .2s}.action:hover{transform:translateY(-3px);border-color:#98b384}.icon{font-size:26px;background:#f1f6e8;border-radius:13px;width:51px;height:51px;display:grid;place-items:center;margin-bottom:17px}.card h3{margin:0 0 5px;font-size:17px}.card p{margin:0;font-size:14px;color:var(--muted)}h2{font-size:25px;margin:4px 0 8px}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}.steps{display:flex;gap:13px;padding:13px 0}.number{background:#e9f1db;border-radius:50%;width:30px;height:30px;flex-shrink:0;display:grid;place-items:center}.tag{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;background:#fff3d1;color:#8a6a20}.tag.APPROVED{background:#e0f1df;color:#2b7042}.tag.REVISION,.tag.REJECTED{background:#ffe6df;color:#a34d30}.muted{color:var(--muted)}.small{font-size:13px}.form{max-width:760px;margin:auto}.field{display:flex;flex-direction:column;gap:5px;margin:15px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}input,select,textarea{width:100%;border:1px solid #ccd8cb;border-radius:9px;padding:11px 12px;background:white;color:#243e33}input[type=checkbox]{width:auto}.check{display:flex;gap:9px;align-items:start;margin:18px 0}.note{background:#f1f5e9;padding:15px 18px;border-radius:11px;margin:17px 0;font-size:14px}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:15px}.upload{border:1px dashed #a4b59a;padding:17px;border-radius:12px;background:#fafcf6}.upload img{width:100%;height:130px;object-fit:contain;margin-top:10px}.upload input{font-size:12px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}.stat strong{font-size:32px;display:block;color:var(--green)}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:15px 10px;border-bottom:1px solid #e8ece4}th{color:#7b887d;font-weight:normal}.table-wrap{overflow:auto}.filters{display:flex;gap:12px;align-items:center;margin:20px 0}.filters select{max-width:230px}.detail{margin-top:20px}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.photo{background:#f1f5eb;border-radius:12px;padding:12px;text-align:center}.photo img{width:100%;height:140px;object-fit:contain}.placeholder{height:110px;display:grid;place-items:center;font-size:43px}.history{border-left:2px solid #dce6d1;margin:20px 0;padding-left:19px}.history p{margin:12px 0}footer{text-align:center;padding:25px;font-size:12px;color:#7c8c7f;border-top:1px solid #e1e7dc}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#203e31;color:white;padding:13px 24px;border-radius:12px;box-shadow:0 5px 25px #0002;z-index:9}.guide{border-top:5px solid var(--c)}.guide .icon{font-size:35px}.topline{display:flex;justify-content:space-between;gap:20px;align-items:center}@media(max-width:780px){header{padding:15px;align-items:start;flex-direction:column}.brand strong{font-size:16px}main{padding:20px 16px 40px}.hero{padding:28px;grid-template-columns:1fr}.hero h1{font-size:33px}.art{min-height:230px}.circle{height:230px;width:230px}.grid,.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.card{padding:19px}.row{grid-template-columns:1fr;gap:0}.photos{grid-template-columns:1fr 1fr}.filters{flex-wrap:wrap}.uploads{grid-template-columns:1fr}.topline{align-items:start;flex-direction:column}nav{gap:2px}nav button{padding:8px 11px;font-size:14px}}
</style><header><div class="brand"><div class="mark">♻</div><div><strong>บ้านนี้แยกขยะ</strong><div class="sub">องค์การบริหารส่วนตำบลบางทอง</div></div></div><div class="switch"><button id="citizen" onclick="setMode('citizen')">หน้าประชาชน</button><button id="staff" onclick="setMode('staff')">หน้าเจ้าหน้าที่ (จำลอง)</button></div></header><div class="demo">โหมดทดลอง • ใช้ข้อมูลสมมติเท่านั้น • ข้อมูลบันทึกเฉพาะเบราว์เซอร์นี้ ยังไม่เชื่อมฐานข้อมูลของ อบต.</div><main><nav id="nav"></nav><div id="app"></div></main><footer>บ้านนี้แยกขยะ อบต.บางทอง · ร่วมกันแยก ร่วมกันลด เพื่อชุมชนของเรา<br>ต้นแบบเพื่อทดลองขั้นตอน ส่วนลด 10 บาทต้องผ่านการพิจารณาตามหลักเกณฑ์ของหน่วยงาน</footer><div id="toast" class="toast" hidden></div>
<script>
const KEY='bt-waste-demo-v1', labels={PENDING:'รอตรวจสอบ',APPROVED:'ผ่านการตรวจ',REVISION:'ต้องแก้ไข',REJECTED:'ไม่ผ่าน'};let mode='citizen',view='home',selected=null;
const types=[['food','เศษอาหาร','🍃','#69a66b'],['recycle','รีไซเคิล','♻','#e1b851'],['general','ขยะทั่วไป','▤','#6097c3'],['hazardous','ขยะอันตราย','⚠','#d87a68']];
const initial=()=>({houses:[{id:'DEMO-001',name:'ครัวเรือนตัวอย่าง 1',village:'1',no:'ตัวอย่าง 01',phone:'0000000000'},{id:'DEMO-002',name:'ครัวเรือนตัวอย่าง 2',village:'2',no:'ตัวอย่าง 02',phone:'0000000000'},{id:'DEMO-003',name:'ครัวเรือนตัวอย่าง 3',village:'1',no:'ตัวอย่าง 03',phone:'0000000000'}],subs:[{id:'SUB-001',hh:'DEMO-001',period:'2569-11',status:'PENDING',date:'16/11/2569 09:30',photos:{},hazNone:true,note:'',history:[{text:'ส่งหลักฐานรอบเดือนพฤศจิกายน',time:'16/11/2569 09:30'}]},{id:'SUB-002',hh:'DEMO-002',period:'2569-11',status:'APPROVED',date:'15/11/2569 14:00',photos:{},hazNone:true,note:'แยกขยะครบตามเกณฑ์ตัวอย่าง',history:[{text:'เจ้าหน้าที่จำลอง: รอตรวจสอบ → ผ่านการตรวจ',time:'16/11/2569 10:00'}]},{id:'SUB-003',hh:'DEMO-003',period:'2569-11',status:'REVISION',date:'15/11/2569 15:00',photos:{},hazNone:true,note:'ขอภาพรีไซเคิลที่เห็นการแยกประเภทชัดเจนขึ้น',history:[{text:'เจ้าหน้าที่จำลอง: รอตรวจสอบ → ต้องแก้ไข',time:'16/11/2569 10:20'}]}]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('พื้นที่เบราว์เซอร์เต็ม กรุณาลดขนาดภาพแล้วลองใหม่');return false}}function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4000)}const time=()=>new Date().toLocaleString('th-TH');const tag=s=>`<span class="tag ${s}">${labels[s]}</span>`;const hhOptions=()=>db.houses.map(h=>`<option value="${h.id}">${h.id} · ${esc(h.name)}</option>`).join('');
function setMode(r){mode=r;go(r==='staff'?'queue':'home')}function go(v){view=v;selected=null;render();window.scrollTo(0,0)}function render(){document.title='บ้านนี้แยกขยะ อบต.บางทอง';$('#citizen').classList.toggle('active',mode==='citizen');$('#staff').classList.toggle('active',mode==='staff');let menus=mode==='citizen'?[['home','หน้าแรก'],['register','ลงทะเบียนรับบริการ / ถังขยะ'],['submit','ส่งภาพขยะ'],['status','ตรวจสอบสถานะ'],['guide','วิธีแยกขยะ']]:[['queue','ตรวจหลักฐาน'],['report','รายงานสรุป'],['settings','ข้อมูลการทดลอง']];$('#nav').innerHTML=menus.map(([id,t])=>`<button class="${view===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('');pages[view]()}
const pages={home(){ $('#app').innerHTML=`<div class="hero"><div><div class="eyebrow">BANG THONG • GREEN COMMUNITY</div><h1>บริการขยะครบในที่เดียว<br>เพื่อชุมชนบางทอง</h1><p>ลงทะเบียนรับบริการและถังขยะ หรือสมัครคัดแยกขยะเพิ่มเติม ด้วยรหัสผู้ใช้บริการเดียวกัน</p><button class="btn light" onclick="go('register')">ลงทะเบียนรับบริการเก็บขยะ　↗</button><div class="small" style="margin-top:18px;color:#c1d5c6">สมัครคัดแยกเพิ่มเติม เพื่อประกอบการพิจารณาส่วนลด 10 บาท</div></div><div class="art" aria-label="ภาพประกอบบ้านและถังคัดแยกขยะ"><div class="circle"></div><div class="leaf"></div><div class="house"><div class="roof"></div><div class="door"></div><div class="window"></div></div><div class="bins">${types.map(t=>`<div class="bin" style="background:${t[3]}">${t[2]}</div>`).join('')}</div></div></div><div class="grid">${[['register','⌂','รับบริการ / ถังขยะ','ทะเบียนบริการและหมายเลขถัง'],['submit','↥','ส่งภาพขยะ','ส่งหลักฐานประจำรอบ'],['status','◎','ตรวจสอบสถานะ','ติดตามผลการตรวจ'],['guide','♧','วิธีแยกขยะ','แยกให้ถูกทั้ง 4 ประเภท']].map(([v,i,h,p])=>`<button class="card action" onclick="go('${v}')"><div class="icon">${i}</div><h3>${h}　↗</h3><p>${p}</p></button>`).join('')}</div><div class="two"><div class="card"><h3>เข้าร่วมง่าย ๆ ใน 3 ขั้นตอน</h3>${[['ลงทะเบียนรับบริการ','รายเดิมให้เจ้าหน้าที่เพิ่มจากสมุด รายใหม่สมัครรับบริการ'],['สมัครคัดแยกเพิ่มเติม แล้วส่งภาพ','ใช้รหัสเดิม ไม่สร้างบ้านหรือออกเลขถังซ้ำ'],['ติดตามผลการตรวจ','ดูผลและแก้ไขหลักฐานได้จากเมนูสถานะ']].map((t,i)=>`<div class="steps"><div class="number">${i+1}</div><div><b>${t[0]}</b><div class="small muted">${t[1]}</div></div></div>`).join('')}</div><div class="card"><div class="topline"><h3>สถานะครัวเรือนตัวอย่าง</h3>${tag(db.subs[0].status)}</div><p style="margin-top:15px">DEMO-001 • พฤศจิกายน 2569</p><h3 style="margin-top:20px">${labels[db.subs[0].status]}</h3><p>${esc(db.subs[0].note||'ระบบได้รับหลักฐานแล้ว อยู่ระหว่างรอเจ้าหน้าที่ตรวจสอบ')}</p><button style="margin-top:22px" class="btn ghost" onclick="go('status')">ดูรายละเอียด　→</button></div></div>`},
register(){$('#app').innerHTML=`<div class="form"><h2>ลงทะเบียนรับบริการเก็บขยะ / ถังขยะ</h2><p class="muted">ส่วนที่ 1 · ขอรับบริการเก็บขยะ แยกจากการสมัครคัดแยกขยะ</p><form class="card" id="reg"><div class="note">ใช้ชื่อ บ้านเลขที่ และเบอร์โทรสมมติสำหรับทดลองเท่านั้น</div><div class="field"><label for="name">ชื่อผู้ติดต่อสมมติ *</label><input id="name" name="name" required maxlength="80" placeholder="เช่น ครัวเรือนทดลอง 4"></div><div class="row"><div class="field"><label for="no">บ้านเลขที่สมมติ *</label><input id="no" name="no" required maxlength="30" placeholder="เช่น ทดลอง 04"></div><div class="field"><label for="village">หมู่บ้าน *</label><select id="village" name="village">${Array.from({length:10},(_,i)=>`<option value="${i+1}">หมู่ ${i+1} (ตัวอย่าง)</option>`).join('')}</select></div></div><div class="field"><label for="phone">เบอร์โทรสมมติ 10 หลัก *</label><input id="phone" name="phone" inputmode="numeric" pattern="[0-9]{10}" required value="0000000000"></div><label class="check"><input type="checkbox" required><span class="small">รับทราบว่าเป็นการทดลอง และข้อมูลจะถูกเก็บเฉพาะในเบราว์เซอร์นี้ สามารถล้างข้อมูลได้จากหน้าเจ้าหน้าที่จำลอง</span></label><button class="btn">ลงทะเบียนครัวเรือน　→</button></form></div>`;$('#reg').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),h=Object.fromEntries(f);h.name=h.name.trim();h.no=h.no.trim();if(!h.name||!h.no)return toast('กรุณากรอกข้อมูลให้ครบ');if(db.houses.some(x=>x.no.replace(/\s/g,'')===h.no.replace(/\s/g,'')&&x.village===h.village))return toast('บ้านเลขที่และหมู่บ้านนี้ลงทะเบียนแล้ว');h.id='DEMO-'+String(db.houses.length+1).padStart(3,'0');db.houses.push(h);if(!persist()){db.houses.pop();return}$('#app').innerHTML=`<div class="form card"><div class="icon">✓</div><h2>ลงทะเบียนเรียบร้อยแล้ว</h2><p>เลขครัวเรือนของคุณ</p><h2>${h.id}</h2><p class="muted">${esc(h.name)} · หมู่ ${esc(h.village)}</p><div class="note">เลขนี้เป็นรหัสทดลอง ยังไม่ใช่การลงทะเบียนกับ อบต. การสมัครบริการนี้ยังไม่สมัครคัดแยกขยะหรือออกเลขถัง เจ้าหน้าที่จัดสรรถังแยกตามทะเบียนบริการ</div><button class="btn" onclick="go('enroll')">สมัครคัดแยกขยะเพิ่มเติม　→</button></div>`}},
submit(){$('#app').innerHTML=`<div class="form"><h2>ส่งภาพการคัดแยกขยะ</h2><p class="muted">ส่งภาพชัดเจน เห็นขยะที่แยกไว้ตามประเภท</p><form id="send" class="card"><div class="row"><div class="field"><label for="house">ครัวเรือนจำลอง</label><select id="house" name="hh">${hhOptions()}</select></div><div class="field"><label for="period">รอบรายงาน</label><select id="period" name="period"><option>2569-11</option><option>2569-12</option><option>2570-01</option></select></div></div><div class="note">แนบเฉพาะภาพทดลองที่ไม่มีข้อมูลส่วนบุคคล ภาพจะถูกย่อก่อนเก็บในเบราว์เซอร์ (สูงสุดไฟล์ละ 5 MB)</div><div class="uploads">${types.map(t=>`<div class="upload"><b>${t[2]} ${t[1]}</b><div class="small muted">${t[0]==='hazardous'?'แนบเมื่อมีขยะอันตราย':'จำเป็นต้องแนบภาพ'}</div><input aria-label="ภาพ${t[1]}" id="${t[0]}" type="file" accept="image/jpeg,image/png,image/webp" ${t[0]!=='hazardous'?'required':''}><img id="preview-${t[0]}" hidden alt="ภาพตัวอย่าง${t[1]}"></div>`).join('')}</div><label class="check"><input id="hazNone" type="checkbox"><span>รอบนี้ไม่มีขยะอันตราย</span></label><label class="check"><input type="checkbox" required><span class="small">ยืนยันว่าเป็นภาพสำหรับทดลองระบบ และไม่มีใบหน้า ป้ายทะเบียน หรือข้อมูลส่วนบุคคล</span></label><button class="btn" id="sendBtn">ส่งหลักฐาน　→</button><div class="small muted" style="margin-top:10px">หากส่งแก้ไข ระบบเก็บรุ่นหลักฐานเดิมและประวัติไว้</div></form></div>`;let imgs={};types.forEach(([k])=>{$('#'+k).onchange=async e=>{let file=e.target.files[0];if(!file){delete imgs[k];$('#preview-'+k).hidden=true;return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){e.target.value='';delete imgs[k];$('#preview-'+k).hidden=true;return toast('กรุณาใช้ JPG, PNG หรือ WebP ขนาดไม่เกิน 5 MB')}try{imgs[k]=await compress(file);$('#preview-'+k).src=imgs[k];$('#preview-'+k).hidden=false}catch{e.target.value='';toast('ไม่สามารถอ่านภาพนี้ได้ กรุณาเลือกภาพใหม่')}}});$('#hazNone').onchange=e=>{$('#hazardous').disabled=e.target.checked;if(e.target.checked){delete imgs.hazardous;$('#hazardous').value='';$('#preview-hazardous').hidden=true}};$('#send').onsubmit=e=>{e.preventDefault();if(!imgs.food||!imgs.recycle||!imgs.general)return toast('กรุณารอภาพโหลดและแนบภาพที่จำเป็นครบ 3 ประเภท');if(!$('#hazNone').checked&&!imgs.hazardous)return toast('แนบภาพขยะอันตราย หรือเลือกว่ารอบนี้ไม่มี');let f=new FormData(e.target),hh=f.get('hh'),period=f.get('period'),old=db.subs.find(s=>s.hh===hh&&s.period===period);if(old&&old.status!=='REVISION')return toast('รอบนี้ส่งแล้ว สามารถส่งใหม่ได้เมื่อเจ้าหน้าที่ขอแก้ไข');let snapshot=JSON.stringify(db);if(old){old.versions=old.versions||[];old.versions.push({photos:old.photos,date:old.date,note:old.note});old.photos=imgs;old.status='PENDING';old.date=time();old.hazNone=$('#hazNone').checked;old.note='';old.history.push({text:'ประชาชนจำลองส่งหลักฐานแก้ไข → รอตรวจสอบ',time:time()})}else db.subs.unshift({id:'SUB-'+crypto.randomUUID().slice(0,8).toUpperCase(),hh,period,status:'PENDING',date:time(),photos:imgs,hazNone:$('#hazNone').checked,note:'',history:[{text:'ส่งหลักฐานครั้งแรก → รอตรวจสอบ',time:time()}]});if(!persist()){db=JSON.parse(snapshot);return}go('status');toast('ส่งหลักฐานเรียบร้อยแล้ว')}} ,
status(){$('#app').innerHTML=`<h2>ตรวจสอบสถานะ</h2><p class="muted">ติดตามผลการตรวจหลักฐานของครัวเรือน</p><div class="note">ตัวเลือกครัวเรือนนี้ใช้เฉพาะต้นแบบ ระบบจริงต้องยืนยันตัวตนก่อนดูข้อมูล</div><div class="filters"><label for="lookup">ครัวเรือนจำลอง</label><select id="lookup">${hhOptions()}</select></div><div id="results"></div>`;$('#lookup').onchange=statusResults;statusResults()},
guide(){$('#app').innerHTML=`<h2>แยกให้ถูก เริ่มได้ที่บ้าน</h2><p class="muted">รู้จักขยะ 4 ประเภท ก่อนถ่ายภาพส่งหลักฐาน</p><div class="grid">${[['food','เศษอาหาร','🍃','#69a66b','เศษผัก เปลือกผลไม้ เศษอาหาร','แยกภาชนะมีฝาปิด ลดกลิ่น และนำไปใช้ประโยชน์อย่างเหมาะสม'],['recycle','รีไซเคิล','♻','#e1b851','ขวดพลาสติก กระป๋อง กระดาษ','เทของเหลว ล้างเมื่อจำเป็น และผึ่งให้แห้งก่อนเก็บ'],['general','ขยะทั่วไป','▤','#6097c3','ซองขนม ถุงเปื้อนอาหาร','แยกจากของที่นำกลับมาใช้ประโยชน์ได้ มัดถุงให้เรียบร้อย'],['hazardous','ขยะอันตราย','⚠','#d87a68','ถ่านไฟฉาย หลอดไฟ ภาชนะสารเคมี','เก็บแยกอย่างปลอดภัย ไม่ทุบหรือเผา ส่งตามจุดและรอบที่หน่วยงานกำหนด']].map(t=>`<div class="card guide" style="--c:${t[3]}"><div class="icon">${t[2]}</div><h3>${t[1]}</h3><p>${t[4]}</p><div class="small" style="margin-top:16px">${t[5]}</div></div>`).join('')}</div><div class="card"><h3>ถ่ายภาพอย่างไรให้ตรวจง่าย?</h3><p>ถ่ายในที่สว่าง ให้เห็นชนิดขยะและการแยกภาชนะชัดเจน ไม่ถ่ายติดบุคคล บ้านเลขที่ หรือเอกสารส่วนตัว หากไม่มีขยะอันตรายในรอบนั้น ให้เลือก “รอบนี้ไม่มีขยะอันตราย”</p></div><div class="note">รายละเอียดการส่งหลักฐานและเกณฑ์โครงการต้องให้ อบต. กำหนดก่อนใช้งานจริง</div>`},
queue(){$('#app').innerHTML=`<div class="topline"><div><h2>ตรวจหลักฐานการคัดแยกขยะ</h2><p class="muted">พื้นที่ทดลองสำหรับเจ้าหน้าที่ อบต.บางทอง</p></div><span class="tag">เจ้าหน้าที่จำลอง</span></div><div class="stats">${['PENDING','APPROVED','REVISION','REJECTED'].map(s=>`<div class="card stat"><span class="small muted">${labels[s]}</span><strong>${db.subs.filter(x=>x.status===s).length}</strong><span class="small muted">รายการ</span></div>`).join('')}</div><div class="card"><div class="filters"><select aria-label="กรองสถานะ" id="filter"><option value="ALL">ทุกสถานะ</option>${Object.keys(labels).map(s=>`<option value="${s}">${labels[s]}</option>`).join('')}</select><input id="search" aria-label="ค้นหาครัวเรือน" placeholder="ค้นหาเลขครัวเรือน / ชื่อสมมติ"></div><div class="table-wrap" id="queueTable"></div></div><div id="detail" class="detail"></div>`;$('#filter').onchange=queueRows;$('#search').oninput=queueRows;queueRows()},
report(){$('#app').innerHTML=`<div class="topline"><div><h2>รายงานสรุปโครงการ</h2><p class="muted">ภาพรวมทะเบียนและผลการตรวจหลักฐาน</p></div><button class="btn" onclick="exportCSV()">ดาวน์โหลดรายงาน CSV　↓</button></div><div class="filters"><label for="rp">รอบรายงาน</label><select id="rp"><option value="ALL">ทุกรอบ</option>${[...new Set(db.subs.map(s=>s.period))].sort().map(p=>`<option>${p}</option>`).join('')}</select></div><div id="reportBody"></div><div class="note">ผล “ผ่านการตรวจ” เป็นผลตรวจหลักฐานเท่านั้น ยังไม่ใช่การอนุมัติส่วนลดค่าธรรมเนียม 10 บาท</div>`;$('#rp').onchange=reportBody;reportBody()},
settings(){$('#app').innerHTML=`<div class="form card"><h2>ข้อมูลการทดลอง</h2><p>ต้นแบบนี้ใช้ข้อมูลสมมติและจัดเก็บเฉพาะเบราว์เซอร์ของผู้ทดลอง ข้อมูลจะไม่ส่งถึง อบต. และไม่ซิงก์ข้ามเครื่อง</p><div class="note">หน้าเจ้าหน้าที่เป็นการจำลองบทบาท ไม่มีระบบบัญชีเจ้าหน้าที่หรือการยืนยันตัวตนสำหรับใช้งานจริง</div><h3>ก่อนเปิดใช้กับประชาชน</h3><ul><li>เชื่อมฐานข้อมูลและพื้นที่เก็บภาพที่ควบคุมสิทธิ</li><li>ยืนยันตัวตนประชาชนและบัญชีเจ้าหน้าที่</li><li>กำหนดหมู่บ้าน รอบส่ง และหลักเกณฑ์ที่หน่วยงานรับรอง</li><li>จัดทำประกาศความเป็นส่วนตัว การสำรอง และระยะเวลาเก็บข้อมูล</li><li>ตรวจสอบข้อบัญญัติและขั้นตอนพิจารณาส่วนลด 10 บาท</li></ul><button class="btn ghost" onclick="resetDemo()">ล้างข้อมูลและเริ่มทดลองใหม่</button></div>`}}
function statusResults(){let id=$('#lookup').value,subs=db.subs.filter(s=>s.hh===id);$('#results').innerHTML=subs.length?subs.map(s=>`<div class="card" style="margin-bottom:18px"><div class="topline"><div><h3>รอบ ${esc(s.period)}</h3><p>${s.id} · ส่งเมื่อ ${esc(s.date)}</p></div>${tag(s.status)}</div><div class="note">${esc(s.note||'ระบบได้รับหลักฐานแล้ว อยู่ระหว่างรอเจ้าหน้าที่ตรวจสอบ')}</div>${s.status==='APPROVED'?'<p class="small">หลักฐานผ่านการตรวจ รอการพิจารณาสิทธิส่วนลดตามเกณฑ์หน่วยงาน</p>':''}${s.status==='REVISION'?'<button class="btn" onclick="go(\'submit\')">ส่งภาพแก้ไข</button>':''}<details><summary>ประวัติรายการ (${s.history.length})</summary><div class="history">${s.history.map(h=>`<p><b>${esc(h.text)}</b><br><span class="small muted">${esc(h.time)}</span></p>`).join('')}</div></details></div>`).join(''):'<div class="card">ยังไม่มีรายการส่งหลักฐาน <button class="btn ghost" onclick="go(\'submit\')">ส่งหลักฐาน</button></div>'}
function queueRows(){let f=$('#filter').value,q=$('#search').value.toLowerCase();let rows=db.subs.filter(s=>(f==='ALL'||s.status===f)&& (s.hh+' '+db.houses.find(h=>h.id===s.hh)?.name).toLowerCase().includes(q));$('#queueTable').innerHTML=`<table><thead><tr><th>ครัวเรือน</th><th>รอบรายงาน</th><th>วันที่ส่ง</th><th>สถานะ</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${s.hh}</b><div class="small muted">${esc(db.houses.find(h=>h.id===s.hh)?.name)}</div></td><td>${esc(s.period)}</td><td>${esc(s.date)}</td><td>${tag(s.status)}</td><td><button class="btn ghost" onclick="review('${s.id}')">ตรวจภาพ</button></td></tr>`).join('')||'<tr><td colspan="5">ไม่พบรายการตามเงื่อนไข</td></tr>'}</tbody></table>`}
function review(id){selected=id;const s=db.subs.find(s=>s.id===id);$('#detail').innerHTML=`<div class="card"><div class="topline"><h3>${s.hh} · ${s.id}</h3>${tag(s.status)}</div><p class="small muted">ภาพของรายการตัวอย่างเริ่มต้นใช้สัญลักษณ์แทนภาพถ่าย</p><div class="photos">${types.map(([k,t,icon])=>`<div class="photo"><b class="small">${t}</b>${s.photos[k]?`<img alt="หลักฐาน${t}" src="${s.photos[k]}">`:`<div class="placeholder">${icon}</div><span class="small muted">${k==='hazardous'&&s.hazNone?'ไม่มีในรอบนี้':'ภาพจำลอง'}</span>`}</div>`).join('')}</div>${s.versions?.length?`<details style="margin-top:18px"><summary>หลักฐานก่อนแก้ไข (${s.versions.length} รุ่น)</summary>${s.versions.map((v,i)=>`<h4>รุ่น ${i+1} · ${esc(v.date)}</h4><div class="photos">${types.map(([k,t,icon])=>`<div class="photo">${esc(t)}${v.photos[k]?`<img src="${v.photos[k]}" alt="หลักฐานรุ่นก่อน ${t}">`:`<div class="placeholder">${icon}</div>`}</div>`).join('')}</div>`).join('')}</details>`:''}<form id="reviewForm"><div class="row"><div class="field"><label for="decision">ผลการตรวจ</label><select id="decision"><option value="APPROVED">ผ่านการตรวจ</option><option value="REVISION">ต้องแก้ไข</option><option value="REJECTED">ไม่ผ่าน</option></select></div><div class="field"><label for="reviewer">ผู้ตรวจ</label><input id="reviewer" value="เจ้าหน้าที่จำลอง" readonly></div></div><div class="field"><label for="reason">เหตุผล / คำแนะนำ (จำเป็นเมื่อแก้ไขหรือไม่ผ่าน)</label><textarea id="reason" maxlength="500" rows="3" placeholder="ระบุรายละเอียดที่ครัวเรือนต้องแก้ไข"></textarea></div><button class="btn">บันทึกผลตรวจจำลอง</button></form><div class="history">${s.history.map(h=>`<p class="small">${esc(h.text)}<br><span class="muted">${esc(h.time)}</span></p>`).join('')}</div></div>`;$('#detail').scrollIntoView({behavior:'smooth',block:'start'});$('#reviewForm').onsubmit=e=>{e.preventDefault();let result=$('#decision').value,note=$('#reason').value.trim();if(result!=='APPROVED'&&!note)return toast('กรุณาระบุเหตุผลให้ครัวเรือนทราบ');let snapshot=JSON.stringify(db);s.history.push({text:`เจ้าหน้าที่จำลอง: ${labels[s.status]} → ${labels[result]}${note?' · '+note:''}`,time:time()});s.status=result;s.note=note||'แยกขยะตามเกณฑ์ตัวอย่าง หลักฐานผ่านการตรวจ';if(!persist()){db=JSON.parse(snapshot);return}render();toast('บันทึกผลตรวจเรียบร้อยแล้ว')}}
function reportRows(){let p=$('#rp').value;return db.subs.filter(s=>p==='ALL'||s.period===p)}function reportBody(){let rows=reportRows();$('#reportBody').innerHTML=`<div class="stats">${[['ครัวเรือนลงทะเบียน',db.houses.length],['รายการในรอบ',rows.length],['ผ่านการตรวจ',rows.filter(s=>s.status==='APPROVED').length],['รอตรวจสอบ',rows.filter(s=>s.status==='PENDING').length]].map(([t,n])=>`<div class="card stat"><span class="small muted">${t}</span><strong>${n}</strong></div>`).join('')}</div><div class="card table-wrap"><table><thead><tr><th>หมู่บ้านตัวอย่าง</th><th>ครัวเรือนลงทะเบียน</th><th>รายการส่ง</th>${Object.values(labels).map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${[...new Set(db.houses.map(h=>h.village))].sort((a,b)=>a-b).map(v=>{let houses=db.houses.filter(h=>h.village===v),sr=rows.filter(s=>houses.some(h=>h.id===s.hh));return `<tr><td>หมู่ ${esc(v)}</td><td>${houses.length}</td><td>${sr.length}</td>${Object.keys(labels).map(st=>`<td>${sr.filter(s=>s.status===st).length}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`}
function exportCSV(){let rows=reportRows(),data=[['เลขรายการ','เลขครัวเรือน','หมู่','รอบรายงาน','สถานะ','วันส่ง','หมายเหตุ'],...rows.map(s=>[s.id,s.hh,db.houses.find(h=>h.id===s.hh)?.village,s.period,labels[s.status],s.date,s.note])];let csv='\ufeff'+data.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='bangthong-waste-demo-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('ดาวน์โหลดรายงานแล้ว')}
function resetDemo(){if(confirm('ล้างข้อมูลทดลองและภาพที่เพิ่มทั้งหมดในเบราว์เซอร์นี้?')){db=initial();persist();go('queue');toast('เริ่มต้นข้อมูลทดลองใหม่แล้ว')}}
function compress(file){return new Promise((resolve,reject)=>{let image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{let c=document.createElement('canvas'),r=Math.min(1,640/Math.max(image.width,image.height));c.width=Math.round(image.width*r);c.height=Math.round(image.height*r);c.getContext('2d').drawImage(image,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.68))};image.onerror=()=>{URL.revokeObjectURL(url);reject()};image.src=url})}render();
</script><script src="management.js"></script><script src="printing.js"></script><script src="official-form.js"></script></html>
